name: AltStore source

on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: altstore
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lidor30/pokedaisy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Update the feed from the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ "$TAG" != "$latest" ]]; then
            echo "::notice::Only the latest stable release updates the AltStore source"
            exit 0
          fi

          mkdir "$RUNNER_TEMP/distribution"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern PokeDaisy.ipa --dir "$RUNNER_TEMP/distribution"
          python3 scripts/generate_altstore_source.py "$RUNNER_TEMP/distribution/PokeDaisy.ipa" \
            > "$RUNNER_TEMP/distribution/source.json"

          cd "$GITHUB_WORKSPACE"
          if git ls-remote --exit-code origin refs/heads/altstore; then
            git fetch origin refs/heads/altstore
            git switch --detach FETCH_HEAD
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
            git switch --orphan altstore
          fi
          cp "$RUNNER_TEMP/distribution/source.json" source.json
          git add source.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Publish AltStore source for $TAG"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ "$TAG" == "$latest" ]]; then
            git push origin HEAD:refs/heads/altstore
          fi

# Gen 3 configs (hacks). The format and the commands: gamedata/README.md.

# Pokémon Rhythm v1.4.0 (invis292; 32 MB, Hackdex's xdelta over FireRed 1.0 rev 0, sha1 b0d6b913…): Vedeo on CFRU, no source.
# FireRed rev 0's RAM, checked on a new game played headless (it deletes retail FireRed's save; `rhythm`: the intro, then the
# game's own givemon / additem through rev 0's ScriptContext_SetupScript, saved in game). Its tables through FireRed 1.0's
# literal pools (gen_cfru_tables.py rhythm); the icon tables likewise: gMonIconTable 0x09E89400, gMonIconPaletteIndices
# 0x099B6C8C, sItemIconTable 0x09E51180. The battle menus' cursors are FireRed's (a written cell + A, headless: `rhythm_battle`).
# Its region map is its own, drawn from the ROM (RomRegionMap).
[config.rhythm]
base = 'firered_rev0'
itemDescs = { preset = 'vanilla', base = 0x09E486C0 }
monIconTable = 0x09E89400
monIconPaletteIndices = 0x099B6C8C
itemIconTable = 0x09E51180
actionCursor = 0x02023FF8
moveCursor = 0x02023FFC

# Pokémon Rhythm v1.6.0 (sha1 6df2b5dc…): v1.4.0's RAM, and v1.4.0's save loads in it (after a login reward: `rhythm_v1_6_0`);
# every table where v1.4.0 has it but the moves (gen_cfru_tables.py rhythm_v1_6_0: the same literal-pool slots, gMoveNames
# 0x08DF7384 / gBattleMoves 0x08DF4540, whose names and powers come out as v1.4.0's), with a few form slots reused (new
# Dialga / Palkia / Ho-Oh and Mega forms where Vivillon and Zygarde forms were: its own species names, types and gender
# ratios, `rhythmV160`). Its battle cursors are FireRed's: a written move cell + A spent that move's PP (`rhythm_v1_6_0_battle`).
[config.rhythm_v1_6_0]
base = 'rhythm'
